[package]
name = "mchost"
version = "0.1.0"
edition = "2024"
description = "Host Minecraft servers and control them remotely from a terminal panel"
license = "MIT"
authors = ["codingsushi79"]
repository = "https://github.com/codingsushi79/mccli"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "6"
flate2 = "1.1.10"
hex = "0.4.3"
libc = "0.2.191"
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.30.2"
rcgen = "0.14.10"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sysinfo = "0.39"
tar = "0.4.46"
toml = "1.2.0"
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
